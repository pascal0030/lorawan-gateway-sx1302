
on:
  release:
    types:
      - created
  push:
    paths:
      - '/**'
      - '!**.md'
      - '!.gitingore'
  workflow_dispatch:


name: Build and Push Docker Container Image
jobs:
  build-and-push-docker-image:
    name: Push Docker image to Github Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository (${{github.event.repository.name}})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract metadata (tags, labels) from (lorawan-gateway-sx1302)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{github.repository_owner}}/${{github.event.repository.name}}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }},enable={{is_default_branch}}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }},enable={{is_default_branch}}
            type=ref,event=pr
            type=raw,value=latest,event=branch,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ startsWith(github.ref_name, 'develop') }}
          labels: |
            org.opencontainers.image.title=${{github.event.repository.name}}
            org.opencontainers.image.description=This Image Containes funcionality to run a LoRaWAN Gateway
            org.opencontainers.image.url=ghcr.io/${{github.repository_owner}}/${{github.event.repository.name}}
      - name: Build and push Dockerimage
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/arm64
          context: .
          push: true
          tags: ${{steps.meta.outputs.tags }}
          labels: ${{steps.meta.outputs.labels }}
          annotations: ${{steps.meta.outputs.annotations}}
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=This Image Containes funcionality to run a LoRaWAN Gateway
      - name: delete old packages (lorawan-gateway-sx1302)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: '${{github.repository_owner}}'
          package-name: '${{github.event.repository.name}}'
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'true'
